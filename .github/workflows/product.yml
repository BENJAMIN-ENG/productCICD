name: Product

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - name: Verify app boots
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          PORT: 3000
        run: |
          npm start &
          sleep 5
          curl --fail http://localhost:3000/health || exit 1
          kill %1